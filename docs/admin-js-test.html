<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>LWPS admin JavaScript test</title><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body>
<div id="lwps-app" class="lwps">
	<div id="lwps-notice" hidden></div>
	<nav class="lwps-flow"><button data-tab="connection">Connection</button><button data-tab="catalog" disabled>Analysis</button><button data-tab="changes" disabled>Changes</button><button data-tab="journal" disabled>Journal</button></nav>
	<section data-panel="connection" class="is-active">
		<span id="lwps-connection-state"></span>
		<form id="lwps-settings-form"><input name="donor_url"><input name="consumer_key"><input name="consumer_secret"><button type="submit" id="lwps-save-test">Save and test</button></form>
		<span id="lwps-connection-result"></span><button id="lwps-next-analysis" disabled>Next</button>
	</section>
	<section data-panel="catalog"><button id="lwps-analyze">Analyze</button><div id="lwps-metrics"></div><div id="lwps-analysis-empty"></div><div id="lwps-analysis-progress" hidden><div class="lwps-analysis-live"><span id="lwps-analysis-live-label"></span><time id="lwps-analysis-elapsed"></time></div><div class="lwps-progress-line"><span></span></div><div><small id="lwps-analysis-caption"></small><strong id="lwps-analysis-percent"></strong></div></div><span id="lwps-analysis-result"></span><button id="lwps-next-changes" disabled>Next</button></section>
	<section data-panel="changes"><input id="lwps-search"><select id="lwps-status-filter"><option value="">All</option><option value="new">New</option><option value="variation_added">Variations to add</option><option value="local_changes">Local changes</option><option value="locked">Locked</option></select><button id="lwps-select-page"><span id="lwps-select-page-label">Select all on page</span></button><button id="lwps-refresh">Refresh</button><span id="lwps-total-changes"></span><table><tbody id="lwps-change-rows"></tbody></table><div id="lwps-pagination"></div><input type="checkbox" id="lwps-select-all"><span id="lwps-selected-count"></span><select id="lwps-operation"><option value="import">Import</option><option value="add_variations">Add variations</option><option value="overwrite">Overwrite</option></select><input type="checkbox" id="lwps-delete-missing"><input type="checkbox" id="lwps-force-locked"><button id="lwps-preview">Preview</button><button id="lwps-preview-all">Preview all</button></section>
	<section data-panel="journal"><button id="lwps-jobs-refresh">Jobs</button><select id="lwps-job-select"><option value="">Empty</option></select><div id="lwps-job-detail"></div></section>
	<div id="lwps-preview-modal" hidden><button class="lwps-modal-close">Close</button><p id="lwps-preview-scope"></p><div id="lwps-preview-summary"></div><button id="lwps-confirm">Confirm</button></div>
</div>
<script>window.LWPS_CONFIG={restUrl:'https://lwps.test/wp-json/lwps/v1/admin',nonce:'rest-nonce',ajaxUrl:'https://lwps.test/wp-admin/admin-ajax.php',ajaxNonce:'ajax-nonce',perPage:30};</script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
